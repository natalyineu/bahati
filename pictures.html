<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picture Match – Bahati Language School</title>
  <meta name="description" content="Match pictures with words in Spanish, Chinese, Polish and Russian. A fun mini game from Bahati Language School.">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap&subset=latin,latin-ext,cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="game.css">
</head>
<body class="game-body">
  <button id="mute" class="mute" type="button" aria-pressed="false" aria-label="Toggle music">🎵</button>
  <div class="bg-float" aria-hidden="true"><span>🎵</span><span>✦</span><span>♡</span><span>🎶</span><span>✦</span><span>♡</span><span>🎵</span><span>✦</span></div>
  <div id="app" class="app">

    <section id="screen-start" class="screen">
      <a class="back" href="games.html">← All games</a>
      <a class="btn btn-ghost mode-link" href="game.html">⚔️ Try Word Duel</a>
      <img class="mascot-big" src="images/panda.svg" alt="" width="200" height="200">
      <h1>Picture Match</h1>
      <p class="sub">Match each picture with its word. Fast and with few mistakes earns more stars.</p>
      <div class="stats-row"><span class="pill">⭐ Best stars: <b id="best-stars">0</b></span></div>
      <div class="picker">
        <p class="pick-title">I want to learn</p>
        <div id="chips-to" class="chips"></div>
        <p class="pick-title">Level</p>
        <div id="chips-lvl" class="chips"></div>
        <p id="lvl-desc" class="lvl-desc"></p>
        <label class="toggle"><input type="checkbox" id="hint"> Show English hint under the word</label>
        <div class="end-actions"><button id="play" class="btn game-btn">Start</button></div>
      </div>
    </section>

    <section id="screen-play" class="screen lesson" hidden>
      <header class="topbar">
        <button id="quit" class="icon-btn" aria-label="Quit game">×</button>
        <div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div></div>
        <div class="timer" id="timer" aria-label="Time">0s</div>
      </header>
      <div class="lesson-body">
        <p id="prompt" class="prompt">Tap a picture, then its word</p>
        <p id="round" class="round"></p>
        <div id="board" class="pic-board">
          <div id="col-pics" class="pic-col"></div>
          <div id="col-words" class="pic-col"></div>
        </div>
        <div id="msg" class="pic-msg" role="status"></div>
      </div>
    </section>

    <section id="screen-end" class="screen" hidden>
      <img id="end-mascot" class="mascot-big dance" src="images/bunny.svg" alt="" width="200" height="200">
      <h1 id="end-title">All matched! 🎉</h1>
      <div id="stars" class="stars" aria-label="Stars"></div>
      <div class="stats-row">
        <span class="pill">⏱ <b id="end-time">0</b>s</span>
        <span class="pill">🙈 <b id="end-miss">0</b> mistakes</span>
        <span class="pill">⭐ <b id="end-xp">0</b> XP</span>
      </div>
      <div class="end-actions">
        <button id="next-level" class="btn" hidden>Next level →</button>
        <button id="again" class="btn btn-ghost">Play again</button>
        <a class="btn btn-ghost" href="index.html#trial">Book a free lesson</a>
      </div>
    </section>

  </div>
  <script src="sound.js"></script>
  <script src="data.js"></script>
  <script src="pictures.js"></script>
</body>
</html>
